<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Practice Pad</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" integrity="sha384-nB0miv6/jRmo5UMMR1wu3Gz6NLsoTkbqJghGIsx//Rlm+ZU03BU6SQNC66uf4l5+" crossorigin="anonymous">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" integrity="sha384-7zkQWkzuo3B5mTepMUcHkMB5jZaolc2xDwL6VFqjFALcbeS9Ggm/Yr2r3Dy4lfFg" crossorigin="anonymous"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js" integrity="sha384-43gviWU0YVjaDtb/GhzOouOXtZMP/7XUzwPTstBeZFe/+rCMvRwr4yROQP43s0Xk" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="top">
    <strong>Practice Pad</strong>
    <span id="unit"></span>
  </header>
  <div class="layout">
    <main>
      <h1>Today's practice</h1>
      <ol id="problems"></ol>
    </main>
    <aside class="help" aria-label="Help">
      <h2>Need a hand?</h2>
      <ol id="help-messages" aria-live="polite"></ol>
      <form id="help-form">
        <label for="help-input" class="visually-hidden">Your question</label>
        <textarea id="help-input" rows="2" placeholder="Ask about a problem" required></textarea>
        <button type="submit">Ask</button>
      </form>
    </aside>
  </div>
  <script src="/app.js" type="module"></script>
</body>
</html>
